# nginx server block for sukrucakmak.com — static Nuxt generate output.
# Place in /etc/nginx/conf.d/sukrucakmak.com.conf (AlmaLinux) and reload nginx.

# --- HTTP :80 ---
# Cloudflare "Flexible" modunda tek başına yeterli (CF->origin HTTP gider).
# Full/Full(strict) modunda origin sertifikası ile 443 bloğunu da aç.
server {
    listen 80;
    listen [::]:80;
    server_name sukrucakmak.com www.sukrucakmak.com;

    root /var/www/sukrucakmak.com;
    index index.html;

    # Custom 404 page (prerendered by nuxt generate); status stays 404.
    error_page 404 /404.html;

    # Hashed build assets — safe to cache forever.
    location /_nuxt/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Clean URLs: /blog → /blog/index.html produced by nuxt generate.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Never cache HTML/payloads.
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}

