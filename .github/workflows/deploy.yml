name: Deploy to sukrucakmak.com

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild at 00:05 Europe/Istanbul publishes posts whose date has come.
  schedule:
    - cron: '5 21 * * *'

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate static site
        run: npm run generate

      - name: Verify custom 404 page
        run: npm test

      - name: Setup SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_SERVER" >> ~/.ssh/known_hosts

      - name: Sync site to server
        env:
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa -p ${DEPLOY_PORT:-22}" \
            .output/public/ "${DEPLOY_USER}@${DEPLOY_SERVER}:${DEPLOY_PATH}/"
